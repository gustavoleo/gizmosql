name: Test Windows Installer Build

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/windows-build-support'
    paths:
      - 'installer/**'
      - 'installer-bundle/**'
      - 'scripts/fetch-*.ps1'
      - 'scripts/prepare-sample-db.ps1'
      - 'build/windows/sample-data/**'
      - '.github/workflows/test-msi.yml'

jobs:
  test-msi:
    name: Test Windows Installer Build
    runs-on: windows-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version 6.0.2
          wix extension add WixToolset.UI.wixext/6.0.2
          wix extension add WixToolset.Bal.wixext/6.0.2

      - name: Create dummy executables
        run: |
          New-Item -ItemType Directory -Force -Path installer\bin
          # Copy a real Windows EXE to use as dummy (has valid PE headers with version info)
          Copy-Item "$env:SystemRoot\System32\cmd.exe" installer\bin\gizmosql_server.exe
          Copy-Item "$env:SystemRoot\System32\cmd.exe" installer\bin\gizmosql_client.exe
          Copy-Item "$env:SystemRoot\System32\vcruntime140.dll" installer\bin\
          Copy-Item "$env:SystemRoot\System32\vcruntime140_1.dll" installer\bin\
          Copy-Item "$env:SystemRoot\System32\msvcp140.dll" installer\bin\

      - name: Stage sample database
        run: .\scripts\prepare-sample-db.ps1

      - name: Convert logo to BMP
        run: |
          Add-Type -AssemblyName System.Drawing
          $logo = [System.Drawing.Image]::FromFile("${{ github.workspace }}\installer\gizmosql_logo.png")
          $banner = New-Object System.Drawing.Bitmap(493, 58)
          $g = [System.Drawing.Graphics]::FromImage($banner)
          $g.Clear([System.Drawing.Color]::White)
          $g.DrawImage($logo, 10, 4, 200, 50)
          $g.Dispose()
          $banner.Save("${{ github.workspace }}\installer\banner.bmp", [System.Drawing.Imaging.ImageFormat]::Bmp)
          $dialog = New-Object System.Drawing.Bitmap(493, 312)
          $g = [System.Drawing.Graphics]::FromImage($dialog)
          $g.Clear([System.Drawing.Color]::White)
          $g.DrawImage($logo, 20, 20, 300, 75)
          $g.Dispose()
          $dialog.Save("${{ github.workspace }}\installer\dialog.bmp", [System.Drawing.Imaging.ImageFormat]::Bmp)
          $logo.Dispose()

      - name: Create license.rtf
        run: |
          $license = Get-Content "${{ github.workspace }}\LICENSE" -Raw
          $rtf = "{\rtf1\ansi\deff0 {\fonttbl {\f0 Consolas;}}\f0\fs18 " + ($license -replace "`n", "\par ") + "}"
          Set-Content -Path "${{ github.workspace }}\installer\license.rtf" -Value $rtf
          Set-Content -Path "${{ github.workspace }}\installer-bundle\assets\license.rtf" -Value $rtf

      - name: Build Core MSI
        run: |
          wix build `
            "${{ github.workspace }}\installer\GizmoSQL.wxs" `
            -arch x64 `
            -b BinDir="${{ github.workspace }}\installer\bin" `
            -b SampleDataDir="${{ github.workspace }}\installer\staging\sample-data" `
            -b "${{ github.workspace }}\installer" `
            -o "${{ github.workspace }}\installer\GizmoSQL-Core-x64.msi" `
            -ext WixToolset.UI.wixext

      - name: Stage dummy chained MSIs
        run: |
          New-Item -ItemType Directory -Force -Path installer\staging\ui | Out-Null
          New-Item -ItemType Directory -Force -Path installer\staging\powerbi | Out-Null
          Copy-Item installer\GizmoSQL-Core-x64.msi installer\staging\ui\GizmoSQL-UI-x64.msi -Force
          Copy-Item installer\GizmoSQL-Core-x64.msi installer\staging\powerbi\GizmoSQL-PowerBI-Setup-x64.msi -Force

      - name: Build unsigned bundle
        run: |
          wix build `
            "${{ github.workspace }}\installer-bundle\GizmoSQL.Bundle.wxs" `
            -arch x64 `
            -b CoreMsiDir="${{ github.workspace }}\installer" `
            -b UiMsiDir="${{ github.workspace }}\installer\staging\ui" `
            -b PowerBIMsiDir="${{ github.workspace }}\installer\staging\powerbi" `
            -b "${{ github.workspace }}\installer-bundle" `
            -o "${{ github.workspace }}\installer-bundle\GizmoSQL-Setup-x64-unsigned.exe" `
            -ext WixToolset.Bal.wixext

      - name: Detach Burn engine for signing
        run: |
          # Burn bundles must sign the engine first, then reattach it and sign
          # the final bundle EXE.
          wix burn detach `
            "${{ github.workspace }}\installer-bundle\GizmoSQL-Setup-x64-unsigned.exe" `
            -engine "${{ github.workspace }}\installer-bundle\GizmoSQL-Setup-engine.exe"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Install AzureSignTool
        run: dotnet tool install --global AzureSignTool

      - name: Sign Core MSI
        run: |
          AzureSignTool sign `
            --azure-key-vault-url "${{ secrets.AZURE_KEY_VAULT_URI }}" `
            --azure-key-vault-certificate "${{ secrets.AZURE_CERT_NAME }}" `
            --azure-key-vault-managed-identity `
            --timestamp-rfc3161 http://timestamp.digicert.com `
            --timestamp-digest sha256 `
            --file-digest sha256 `
            --verbose `
            "${{ github.workspace }}\installer\GizmoSQL-Core-x64.msi"

      - name: Sign detached Burn engine
        run: |
          AzureSignTool sign `
            --azure-key-vault-url "${{ secrets.AZURE_KEY_VAULT_URI }}" `
            --azure-key-vault-certificate "${{ secrets.AZURE_CERT_NAME }}" `
            --azure-key-vault-managed-identity `
            --timestamp-rfc3161 http://timestamp.digicert.com `
            --timestamp-digest sha256 `
            --file-digest sha256 `
            --verbose `
            "${{ github.workspace }}\installer-bundle\GizmoSQL-Setup-engine.exe"

      - name: Reattach signed Burn engine
        run: |
          wix burn reattach `
            "${{ github.workspace }}\installer-bundle\GizmoSQL-Setup-x64-unsigned.exe" `
            -engine "${{ github.workspace }}\installer-bundle\GizmoSQL-Setup-engine.exe" `
            -o "${{ github.workspace }}\installer-bundle\GizmoSQL-Setup-x64.exe"

      - name: Sign bundle EXE
        run: |
          AzureSignTool sign `
            --azure-key-vault-url "${{ secrets.AZURE_KEY_VAULT_URI }}" `
            --azure-key-vault-certificate "${{ secrets.AZURE_CERT_NAME }}" `
            --azure-key-vault-managed-identity `
            --timestamp-rfc3161 http://timestamp.digicert.com `
            --timestamp-digest sha256 `
            --file-digest sha256 `
            --verbose `
            "${{ github.workspace }}\installer-bundle\GizmoSQL-Setup-x64.exe"

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GizmoSQL-test-windows-installers.zip
          path: |
            installer/GizmoSQL-Core-x64.msi
            installer-bundle/GizmoSQL-Setup-x64.exe
          if-no-files-found: error
